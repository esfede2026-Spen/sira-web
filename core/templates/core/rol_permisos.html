{% extends 'core/base.html' %}{% block title %}Permisos · SIRA{% endblock %}{% block content %}<section class="card"><h1>{{data.rol.nombre}}</h1><form method="post">{% csrf_token %}<div class="permission-grid">{% for p in data.permisos %}<label class="check"><input type="checkbox" name="permisos" value="{{p.id_permiso}}" {% if p.concedido == 'S' %}checked{% endif %}> <b>{{p.codigo}}</b><small>{{p.descripcion}}</small></label>{% endfor %}</div><div class="buttons"><a class="secondary" href="{% url 'roles' %}">Regresar</a><button class="primary">Guardar permisos</button></div></form></section>{% endblock %}
